<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الطلبات | Hamza Bot</title>
  <meta name="description" content="لوحة طلبات العمل والخدمات — تواصل مباشرة مع أصحاب الطلبات" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0d14;
      --surface: #111827;
      --card:    #161d2e;
      --border:  rgba(255,255,255,0.07);
      --a1:      #f59e0b;
      --a2:      #8b5cf6;
      --a3:      #06b6d4;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --danger:  #ef4444;
      --success: #22c55e;
      --warn:    #f97316;
      --r:       14px;
    }

    body { font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
    body::before, body::after { content:''; position:fixed; border-radius:50%; filter:blur(120px); opacity:0.1; pointer-events:none; z-index:0; }
    body::before { width:600px;height:600px;background:var(--a2);top:-200px;right:-150px; }
    body::after  { width:500px;height:500px;background:var(--a1);bottom:-200px;left:-150px; }

    /* ── Header ── */
    header {
      position:sticky;top:0;z-index:50;
      background:rgba(10,13,20,0.9);backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
      padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .logo { display:flex;align-items:center;gap:10px; }
    .logo-icon { width:40px;height:40px;background:linear-gradient(135deg,var(--a1),var(--a2));border-radius:11px;display:grid;place-items:center;font-size:19px; }
    .logo-text { font-size:19px;font-weight:900;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent; }
    .hstats { display:flex;gap:12px; }
    .schip { display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);padding:5px 13px;border-radius:50px;font-size:13px;color:var(--muted); }
    .schip b { color:var(--text); }
    /* Admin badge */
    .admin-btn {
      display:flex;align-items:center;gap:6px;
      background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);
      color:var(--danger);padding:6px 14px;border-radius:50px;
      font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;
    }
    .admin-btn:hover { background:rgba(239,68,68,0.2); }
    .admin-btn .badge-count {
      background:var(--danger);color:#fff;border-radius:50px;
      padding:1px 7px;font-size:11px;font-weight:900;
    }

    /* ── Hero ── */
    .hero { text-align:center;padding:55px 20px 36px;position:relative;z-index:1; }
    .hero-badge { display:inline-flex;align-items:center;gap:6px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--a1);padding:5px 16px;border-radius:50px;font-size:13px;font-weight:600;margin-bottom:18px; }
    h1 { font-size:clamp(26px,6vw,50px);font-weight:900;line-height:1.2;margin-bottom:12px; }
    h1 .grad { background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));-webkit-background-clip:text;-webkit-text-fill-color:transparent; }
    .hero-sub { color:var(--muted);font-size:15px;max-width:480px;margin:0 auto 32px; }

    /* ── Search ── */
    .search-wrap { max-width:620px;margin:0 auto 36px;display:flex;gap:10px;padding:0 16px;position:relative;z-index:2; }
    .search-wrap input { flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 16px;color:var(--text);font-family:'Cairo',sans-serif;font-size:15px;outline:none;transition:border-color 0.2s; }
    .search-wrap input:focus { border-color:var(--a2); }
    .search-wrap input::placeholder { color:var(--muted); }
    .btn-s { background:linear-gradient(135deg,var(--a2),var(--a3));border:none;border-radius:var(--r);padding:13px 20px;color:#fff;font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:opacity 0.2s,transform 0.15s; }
    .btn-s:hover { opacity:0.9;transform:translateY(-1px); }

    /* ── Filters ── */
    .filters { display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:32px;padding:0 16px; }
    .fbtn { background:var(--surface);border:1px solid var(--border);padding:7px 18px;border-radius:50px;color:var(--muted);font-family:'Cairo',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s; }
    .fbtn:hover,.fbtn.active { background:linear-gradient(135deg,var(--a2),var(--a1));border-color:transparent;color:#fff; }

    /* ── Grid ── */
    .grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:0 18px 110px;max-width:1200px;margin:0 auto;position:relative;z-index:1; }

    /* ── Card ── */
    .card { background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:13px;transition:transform 0.2s,box-shadow 0.2s,border-color 0.2s;animation:fadeUp 0.4s ease both; }
    .card:hover { transform:translateY(-3px);box-shadow:0 16px 50px rgba(0,0,0,0.4);border-color:rgba(139,92,246,0.3); }
    .card.flagged { border-color:rgba(239,68,68,0.4);background:rgba(239,68,68,0.04); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }

    .card-header { display:flex;align-items:flex-start;gap:11px; }
    .avatar { width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-size:20px;flex-shrink:0; }
    .cmeta { flex:1; }
    .cname { font-size:15px;font-weight:700;margin-bottom:3px; }
    .ctime { font-size:12px;color:var(--muted); }
    .cbadge { padding:4px 10px;border-radius:50px;font-size:11px;font-weight:700;flex-shrink:0; }
    .bj { background:rgba(34,197,94,0.12);color:var(--success);border:1px solid rgba(34,197,94,0.25); }
    .bs { background:rgba(6,182,212,0.12);color:var(--a3);border:1px solid rgba(6,182,212,0.25); }
    .br { background:rgba(245,158,11,0.12);color:var(--a1);border:1px solid rgba(245,158,11,0.25); }
    .bu { background:rgba(239,68,68,0.12);color:var(--danger);border:1px solid rgba(239,68,68,0.25); }

    .divider { height:1px;background:var(--border); }
    .cbody { font-size:14px;color:#94a3b8;line-height:1.75; }
    .ctags { display:flex;flex-wrap:wrap;gap:7px; }
    .tag-loc { display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.05);border:1px solid var(--border);padding:4px 11px;border-radius:50px;font-size:12px;color:var(--muted); }
    .tag-cond { background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.2);padding:4px 11px;border-radius:50px;font-size:12px;color:var(--a2); }
    /* flag indicator on card */
    .flag-indicator { display:none;align-items:center;gap:6px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--danger); }
    .flag-indicator.show { display:flex; }

    .card-btns { display:flex;gap:7px; }
    .btn-wa { flex:2;display:flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(135deg,#25d366,#128c7e);border:none;border-radius:11px;padding:11px 14px;color:#fff;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;transition:transform 0.15s,opacity 0.2s; }
    .btn-wa:hover { transform:scale(1.02);opacity:0.9; }
    .btn-call { flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:linear-gradient(135deg,var(--a2),var(--a3));border:none;border-radius:11px;padding:11px;color:#fff;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;transition:transform 0.15s,opacity 0.2s; }
    .btn-call:hover { transform:scale(1.02);opacity:0.9; }
    /* Report button */
    .btn-report {
      display:flex;align-items:center;justify-content:center;gap:5px;
      background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);
      border-radius:11px;padding:9px 12px;
      color:var(--danger);font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;
      cursor:pointer;transition:all 0.2s;white-space:nowrap;
    }
    .btn-report:hover { background:rgba(239,68,68,0.18); }
    .btn-report.reported { background:rgba(239,68,68,0.2);opacity:0.6;cursor:not-allowed; }

    /* ── Section separator ── */
    .section-label {
      max-width:1200px;margin:10px auto 14px;padding:0 18px;
      display:flex;align-items:center;gap:12px;position:relative;z-index:1;
    }
    .section-label span { font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap; }
    .section-label::after { content:'';flex:1;height:1px;background:var(--border); }

    /* ── Admin Panel ── */
    .admin-panel {
      position:fixed;inset:0;z-index:300;
      background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);
      display:none;flex-direction:column;
    }
    .admin-panel.open { display:flex; }
    .ap-header {
      background:var(--surface);border-bottom:1px solid var(--border);
      padding:18px 24px;display:flex;align-items:center;justify-content:space-between;
    }
    .ap-header h2 { font-size:20px;font-weight:900;display:flex;align-items:center;gap:10px; }
    .ap-close { background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;transition:color 0.2s; }
    .ap-close:hover { color:var(--text); }
    .ap-body { flex:1;overflow-y:auto;padding:20px; }
    .ap-empty { text-align:center;padding:60px 20px;color:var(--muted); }
    .ap-empty .icon { font-size:48px;margin-bottom:12px; }

    /* Report card inside admin panel */
    .rep-card {
      background:var(--card);border:1px solid rgba(239,68,68,0.25);border-radius:14px;
      padding:18px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px;
    }
    .rep-card-top { display:flex;align-items:center;gap:12px;flex-wrap:wrap; }
    .rep-avatar { width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--danger),var(--a1));display:grid;place-items:center;font-size:18px;flex-shrink:0; }
    .rep-info { flex:1; }
    .rep-name { font-size:15px;font-weight:700; }
    .rep-city { font-size:12px;color:var(--muted); }
    .rep-desc { font-size:13px;color:#94a3b8;line-height:1.7; }
    .rep-reasons { display:flex;flex-wrap:wrap;gap:6px; }
    .reason-tag {
      padding:4px 10px;border-radius:50px;font-size:11px;font-weight:700;
      background:rgba(239,68,68,0.12);color:var(--danger);border:1px solid rgba(239,68,68,0.25);
    }
    .rep-meta { font-size:12px;color:var(--muted); }
    .rep-actions { display:flex;gap:8px;flex-wrap:wrap; }
    .btn-delete { flex:1;background:linear-gradient(135deg,var(--danger),#b91c1c);border:none;border-radius:10px;padding:10px;color:#fff;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:opacity 0.2s; }
    .btn-delete:hover { opacity:0.88; }
    .btn-ignore { background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 18px;color:var(--muted);font-family:'Cairo',sans-serif;font-size:14px;cursor:pointer; }
    .rep-phone { display:flex;align-items:center;gap:6px;font-size:13px;color:var(--a2);font-weight:600; }

    /* ── FAB ── */
    .fab { position:fixed;bottom:26px;left:26px;z-index:100;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));border:none;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 8px 28px rgba(139,92,246,0.5);display:grid;place-items:center;transition:transform 0.2s,box-shadow 0.2s; }
    .fab:hover { transform:scale(1.1);box-shadow:0 12px 38px rgba(139,92,246,0.7); }

    /* ── Modal ── */
    .overlay { position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);display:none;place-items:center;padding:20px; }
    .overlay.open { display:grid; }
    .modal { background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:460px;animation:mIn 0.3s ease; }
    @keyframes mIn { from{transform:scale(0.9);opacity:0} to{transform:scale(1);opacity:1} }
    .modal h2 { font-size:20px;font-weight:900;margin-bottom:16px;text-align:center; }
    .modal label { display:block;font-size:13px;color:var(--muted);margin:11px 0 5px; }
    .modal input,.modal textarea,.modal select { width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-family:'Cairo',sans-serif;font-size:14px;outline:none;resize:vertical;transition:border-color 0.2s; }
    .modal input:focus,.modal textarea:focus,.modal select:focus { border-color:var(--a2); }
    .mbtns { display:flex;gap:9px;margin-top:18px; }
    .btn-sub { flex:1;background:linear-gradient(135deg,var(--a2),var(--a1));border:none;border-radius:11px;padding:12px;color:#fff;font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:opacity 0.2s; }
    .btn-sub:hover { opacity:0.88; }
    .btn-can { background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 16px;color:var(--muted);font-family:'Cairo',sans-serif;font-size:15px;cursor:pointer; }

    /* ── Report Reason Modal ── */
    .reason-modal { background:var(--card);border:1px solid rgba(239,68,68,0.3);border-radius:20px;padding:28px;width:100%;max-width:400px;animation:mIn 0.3s ease; }
    .reason-modal h2 { font-size:18px;font-weight:900;margin-bottom:16px;text-align:center;color:var(--danger); }
    .reason-opts { display:flex;flex-direction:column;gap:9px;margin-bottom:16px; }
    .reason-opt { display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color 0.2s; }
    .reason-opt:hover { border-color:var(--danger); }
    .reason-opt input { width:18px;height:18px;accent-color:var(--danger);cursor:pointer; }
    .reason-opt label { cursor:pointer;font-size:14px; }

    /* ── Empty ── */
    .empty { text-align:center;padding:50px 20px;color:var(--muted);grid-column:1/-1; }
    .empty .eico { font-size:48px;margin-bottom:12px; }

    /* ── Toast ── */
    .toast { position:fixed;bottom:95px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--success);color:#fff;padding:11px 24px;border-radius:50px;font-size:14px;font-weight:700;opacity:0;transition:opacity 0.3s,transform 0.3s;z-index:400;pointer-events:none; }
    .toast.show { opacity:1;transform:translateX(-50%) translateY(0); }

    @media (max-width:560px) { .hstats{display:none;} .grid{padding:0 10px 100px;} }
  </style>
</head>
<body>

<!-- ─── Header ─── -->
<header>
  <div class="logo">
    <div class="logo-icon">🤝</div>
    <span class="logo-text">لوحة الطلبات</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="hstats">
      <div class="schip">🟢 المنشورات: <b id="liveCount">0</b></div>
      <div class="schip">📍 المدن: <b id="cityCount">0</b></div>
    </div>
    <!-- Admin Reports Button -->
    <button class="admin-btn" onclick="openAdmin()" id="adminBtn">
      🚨 البلاغات <span class="badge-count" id="reportBadge">0</span>
    </button>
  </div>
</header>

<!-- ─── Hero ─── -->
<div class="hero">
  <div class="hero-badge">⚡ منصة العمل والطلبات المحلية</div>
  <h1>ابحث عن <span class="grad">عمال أو خدمات</span><br/>في مدينتك</h1>
  <p class="hero-sub">منشورات حقيقية — تواصل فوري عبر واتساب. إذا شفتي محتوى مشبوه 🚩 بلّغ عنه.</p>
</div>

<!-- ─── Search ─── -->
<div class="search-wrap">
  <input id="searchInput" type="text" placeholder="ابحث عن مهنة، مدينة، طلب..." oninput="renderCards()" />
  <button class="btn-s" onclick="renderCards()">🔍 بحث</button>
</div>

<!-- ─── Filters ─── -->
<div class="filters">
  <button class="fbtn active" onclick="setFilter('all',this)">🗂️ الكل</button>
  <button class="fbtn" onclick="setFilter('job',this)">🧑‍💼 طلب عمل</button>
  <button class="fbtn" onclick="setFilter('service',this)">🛠️ خدمة</button>
  <button class="fbtn" onclick="setFilter('request',this)">📋 طلب</button>
  <button class="fbtn" onclick="setFilter('urgent',this)">🔴 عاجل</button>
</div>

<!-- ─── Cards Grid ─── -->
<div class="section-label"><span>📋 المنشورات</span></div>
<div class="grid" id="cardsGrid"></div>

<!-- ─── FAB ─── -->
<button class="fab" onclick="openModal()" title="إضافة طلب">＋</button>

<!-- ─── Add Post Modal ─── -->
<div class="overlay" id="overlay" onclick="bgC(event)">
  <div class="modal">
    <h2>➕ نشر طلب جديد</h2>
    <label>اسمك أو لقبك *</label>
    <input id="mName" type="text" placeholder="مثال: محمد المراكشي" />
    <label>نوع المنشور *</label>
    <select id="mType">
      <option value="job">🧑‍💼 طلب عمل</option>
      <option value="service">🛠️ خدمة</option>
      <option value="request">📋 طلب</option>
      <option value="urgent">🔴 عاجل</option>
    </select>
    <label>المدينة / المنطقة *</label>
    <input id="mCity" type="text" placeholder="مكناس، الرباط، فاس..." />
    <label>وصف الطلب *</label>
    <textarea id="mDesc" rows="4" placeholder="اشرح ما تبحث عنه أو ما تقدمه..."></textarea>
    <label>شرط أو ملاحظة (اختياري)</label>
    <input id="mCond" type="text" placeholder="مثال: يلزم البطاقة الوطنية" />
    <label>رقم الهاتف / واتساب *</label>
    <input id="mPhone" type="tel" placeholder="0612345678" />
    <div class="mbtns">
      <button class="btn-sub" onclick="submitCard()">✅ نشر الطلب</button>
      <button class="btn-can" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- ─── Report Reason Modal ─── -->
<div class="overlay" id="reportOverlay" onclick="bgCR(event)">
  <div class="reason-modal">
    <h2>🚩 الإبلاغ عن المنشور</h2>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px">اختر سبب البلاغ:</p>
    <div class="reason-opts">
      <div class="reason-opt">
        <input type="radio" name="reason" id="r1" value="محتوى إباحي أو مخل بالآداب" checked />
        <label for="r1">🔞 محتوى إباحي أو مخل بالآداب</label>
      </div>
      <div class="reason-opt">
        <input type="radio" name="reason" id="r2" value="كلام ديني مسيء أو غير لائق" />
        <label for="r2">📿 كلام ديني مسيء أو غير لائق</label>
      </div>
      <div class="reason-opt">
        <input type="radio" name="reason" id="r3" value="نصب واحتيال" />
        <label for="r3">⚠️ نصب واحتيال</label>
      </div>
      <div class="reason-opt">
        <input type="radio" name="reason" id="r4" value="محتوى مزيف أو معلومات خاطئة" />
        <label for="r4">❌ محتوى مزيف أو معلومات خاطئة</label>
      </div>
      <div class="reason-opt">
        <input type="radio" name="reason" id="r5" value="سبب آخر" />
        <label for="r5">🔍 سبب آخر</label>
      </div>
    </div>
    <div class="mbtns">
      <button class="btn-sub" style="background:linear-gradient(135deg,var(--danger),#b91c1c)" onclick="confirmReport()">🚩 إرسال البلاغ</button>
      <button class="btn-can" onclick="closeReportModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- ─── Admin Panel ─── -->
<div class="admin-panel" id="adminPanel">
  <div class="ap-header">
    <h2>🚨 <span>لوحة البلاغات</span> <span id="apCount" style="font-size:14px;color:var(--muted)"></span></h2>
    <button class="ap-close" onclick="closeAdmin()">✕</button>
  </div>
  <div class="ap-body" id="apBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── Emoji pool ──────────────────────────────────────────────────────────────
const EMOJIS = ['👨','👩','🧑','👷','🧔','👩‍💼','👨‍💼','🧑‍🔧','👩‍🔧','👨‍🔧','🧑‍🎓','👩‍🍳'];

// ─── Data ────────────────────────────────────────────────────────────────────
let cards   = JSON.parse(localStorage.getItem('reqBoard_v3') || 'null');
let reports = JSON.parse(localStorage.getItem('reqReports_v3') || '[]');
let reportingId = null; // card being reported

if (!cards) {
  cards = [
    { id:1, name:'عبدالله المكناسي', type:'job', city:'مكناس',
      desc:'كنقلب على ناس يخدمو معايا فمكناس — العمل مؤقت مدته أسبوعين. الأجر يومي.',
      cond:'البطاقة الوطنية شرط', phone:'0775300064', time:'منذ ساعة', emoji:'👷' },
    { id:2, name:'فاطمة الزهراء', type:'service', city:'الرباط',
      desc:'خدمة تنظيف منازل وشقق — عندي تجربة 5 سنين. كنجي لدارك بأي وقت.',
      cond:'', phone:'0661234567', time:'منذ 3 ساعات', emoji:'👩' },
    { id:3, name:'يوسف الحسن', type:'request', city:'الدار البيضاء',
      desc:'كنقلب على بلّاط — تيلكارلي ديالي محتاج تصليح فالكازا المعاريف.',
      cond:'', phone:'0622987654', time:'منذ 5 ساعات', emoji:'🧔' },
    { id:4, name:'مريم بنعلي', type:'urgent', city:'فاس',
      desc:'محتاجة خياطة ديال الستيرة — عاجل ليوم غدا إن شاء الله.',
      cond:'الخدمة ليوم غدا فقط', phone:'0655112233', time:'منذ 30 دقيقة', emoji:'👩‍💼' },
    { id:5, name:'أحمد المراكشي', type:'job', city:'مراكش',
      desc:'كنخدم فالبناء — بناء، سيمانة، صباغة. كنقلب على مقاول أو مشروع.',
      cond:'مع مواصلات', phone:'0633445566', time:'منذ يوم', emoji:'👨‍🔧' },
    { id:6, name:'حسناء الجديدي', type:'service', city:'طنجة',
      desc:'دروس خصوصية فالرياضيات والعلوم — إعدادي وثانوي. كنجي للدار.',
      cond:'إعدادي وثانوي فقط', phone:'0677889900', time:'منذ يومين', emoji:'🧑‍🎓' }
  ];
  save();
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('reqBoard_v3', JSON.stringify(cards));
  localStorage.setItem('reqReports_v3', JSON.stringify(reports));
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function waLink(p) {
  const c = (p||'').replace(/\D/g,'');
  return `https://wa.me/${c.startsWith('0') ? '212'+c.slice(1) : c}`;
}

function badgeClass(t) { return {job:'bj',service:'bs',request:'br',urgent:'bu'}[t]||'br'; }
function badgeLabel(t) { return {job:'🧑‍💼 طلب عمل',service:'🛠️ خدمة',request:'📋 طلب',urgent:'🔴 عاجل'}[t]||'📋'; }

function isReported(id) { return reports.some(r => r.cardId === id); }
function reportCount(id) { return reports.filter(r => r.cardId === id).length; }
function pendingReports() { return reports.filter(r => r.status === 'pending'); }

// ─── Auto-detect suspicious content ─────────────────────────────────────────
const SUSPICIOUS_PATTERNS = [
  /إباح/i, /جنس/i, /بزاز/i, /sex/i, /porn/i, /18\+/i,
  /كلام النبي/i, /حديث نبوي/i, /قال رسول/i, /قال النبي/i, /صلى الله/i,
  /شيخ الإسلام/i, /سبحان الله/i, /الله أكبر/i,
  /احتيال/i, /غش/i, /مزور/i,
];
function autoFlag(text) {
  return SUSPICIOUS_PATTERNS.some(p => p.test(text));
}

// ─── Render ───────────────────────────────────────────────────────────────────
let activeFilter = 'all';

function renderCards() {
  const q = (document.getElementById('searchInput').value||'').toLowerCase();
  const grid = document.getElementById('cardsGrid');

  // Auto-flag suspicious posts
  cards.forEach(c => {
    const combined = [c.name, c.desc, c.cond].join(' ');
    if (autoFlag(combined) && !isReported(c.id)) {
      addReport(c.id, '⚙️ كُشف تلقائياً', 'auto');
    }
  });

  const list = cards.filter(c => {
    const okF = activeFilter === 'all' || c.type === activeFilter;
    const okQ = !q || [c.name,c.city,c.desc,c.cond].some(x=>(x||'').toLowerCase().includes(q));
    return okF && okQ;
  });

  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="eico">🔍</div><p>لا توجد نتائج</p></div>`;
  } else {
    grid.innerHTML = list.map((c,i) => {
      const repd   = isReported(c.id);
      const repCnt = reportCount(c.id);
      return `
      <div class="card ${repd ? 'flagged' : ''}" style="animation-delay:${i*0.04}s" data-id="${c.id}">
        <div class="card-header">
          <div class="avatar">${c.emoji||'👷'}</div>
          <div class="cmeta">
            <div class="cname">${esc(c.name)}</div>
            <div class="ctime">🕐 ${esc(c.time)}</div>
          </div>
          <span class="cbadge ${badgeClass(c.type)}">${badgeLabel(c.type)}</span>
        </div>
        <div class="divider"></div>
        ${repd ? `<div class="flag-indicator show">🚨 تم الإبلاغ عن هذا المنشور ${repCnt > 1 ? '(' + repCnt + ' مرات)' : ''}</div>` : ''}
        <div class="cbody">${esc(c.desc)}</div>
        <div class="ctags">
          <span class="tag-loc">📍 ${esc(c.city)}</span>
          ${c.cond ? `<span class="tag-cond">✅ ${esc(c.cond)}</span>` : ''}
        </div>
        <div class="card-btns">
          <a class="btn-wa" href="${waLink(c.phone)}" target="_blank" rel="noopener">
            <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor"><path d="M16 0C7.163 0 0 7.163 0 16c0 2.822.736 5.476 2.023 7.787L0 32l8.385-2.2A15.94 15.94 0 0016 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm8.07 22.286c-.334.94-1.96 1.794-2.705 1.91-.744.116-1.667.164-2.69-.168-1.023-.332-2.33-.776-4.002-1.52-3.525-1.564-5.83-5.13-6.006-5.37-.176-.24-1.437-1.91-1.437-3.642s.91-2.58 1.233-2.932c.323-.352.703-.44.937-.44l.673.013c.216.009.504-.082.789.603.285.684 1.97 4.82 2.14 5.17.17.35.284.76.056 1.21-.228.45-.342.73-.67 1.12-.33.39-.694.87-.99 1.17-.297.3-.606.624-.261 1.224.346.6 1.538 2.537 3.304 4.11 2.27 2.027 4.187 2.655 4.786 2.96.6.305.95.256 1.3-.154.35-.41 1.492-1.74 1.89-2.337.397-.598.794-.498 1.34-.298.548.2 3.473 1.638 4.07 1.936.597.298.994.447 1.14.695.146.248.146 1.437-.188 2.376z"/></svg>
            واتساب
          </a>
          <a class="btn-call" href="tel:${esc(c.phone)}">📞</a>
          <button class="btn-report ${repd ? 'reported' : ''}" onclick="openReport(${c.id})" ${repd ? 'disabled title="تم الإبلاغ"' : ''}>
            🚩 ${repd ? 'مُبلَّغ' : 'بلّغ'}
          </button>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('liveCount').textContent = cards.length;
  document.getElementById('cityCount').textContent = new Set(cards.map(c=>c.city)).size;
  updateReportBadge();
}

function updateReportBadge() {
  const cnt = pendingReports().length;
  document.getElementById('reportBadge').textContent = cnt;
  document.getElementById('adminBtn').style.display = 'flex';
}

function setFilter(type, btn) {
  activeFilter = type;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

// ─── Add/Submit Post ──────────────────────────────────────────────────────────
function openModal()  { document.getElementById('overlay').classList.add('open'); }
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
function bgC(e) { if (e.target.id==='overlay') closeModal(); }

function submitCard() {
  const name  = document.getElementById('mName').value.trim();
  const type  = document.getElementById('mType').value;
  const city  = document.getElementById('mCity').value.trim();
  const desc  = document.getElementById('mDesc').value.trim();
  const cond  = document.getElementById('mCond').value.trim();
  const phone = document.getElementById('mPhone').value.trim();

  if (!name||!city||!desc||!phone) { toast('⚠️ يرجى ملء الحقول المطلوبة','#f59e0b'); return; }

  cards.unshift({ id:Date.now(), name, type, city, desc, cond, phone, time:'الآن', emoji:EMOJIS[Math.floor(Math.random()*EMOJIS.length)] });
  save(); closeModal();
  ['mName','mCity','mDesc','mCond','mPhone'].forEach(id => document.getElementById(id).value='');
  renderCards();
  toast('✅ تم نشر طلبك بنجاح!');
}

// ─── Reporting ────────────────────────────────────────────────────────────────
function openReport(id) {
  reportingId = id;
  document.getElementById('reportOverlay').classList.add('open');
}
function closeReportModal() {
  document.getElementById('reportOverlay').classList.remove('open');
  reportingId = null;
}
function bgCR(e) { if (e.target.id==='reportOverlay') closeReportModal(); }

function confirmReport() {
  const sel = document.querySelector('input[name="reason"]:checked');
  const reason = sel ? sel.value : 'سبب غير محدد';
  addReport(reportingId, reason, 'user');
  closeReportModal();
  renderCards();
  toast('🚩 تم إرسال بلاغك، شكراً!', '#ef4444');
}

function addReport(cardId, reason, source) {
  // Avoid duplicate same-source reports
  if (reports.some(r => r.cardId === cardId && r.source === source && r.reason === reason)) return;
  const card = cards.find(c => c.id === cardId);
  if (!card) return;
  reports.push({
    id: Date.now() + Math.random(),
    cardId, reason, source,
    cardName: card.name,
    cardCity: card.city,
    cardDesc: card.desc,
    cardPhone: card.phone,
    cardEmoji: card.emoji || '👷',
    time: new Date().toLocaleString('ar-MA'),
    status: 'pending'
  });
  save();
  updateReportBadge();
}

// ─── Admin Panel ──────────────────────────────────────────────────────────────
function openAdmin() {
  document.getElementById('adminPanel').classList.add('open');
  renderAdmin();
}
function closeAdmin() { document.getElementById('adminPanel').classList.remove('open'); }

function renderAdmin() {
  const pending = pendingReports();
  document.getElementById('apCount').textContent = `(${pending.length} بلاغ معلق)`;

  const body = document.getElementById('apBody');
  if (!pending.length) {
    body.innerHTML = `<div class="ap-empty"><div class="icon">✅</div><p>لا توجد بلاغات معلقة</p></div>`;
    return;
  }

  // Group by cardId
  const grouped = {};
  pending.forEach(r => {
    if (!grouped[r.cardId]) grouped[r.cardId] = [];
    grouped[r.cardId].push(r);
  });

  body.innerHTML = Object.entries(grouped).map(([cardId, reps]) => {
    const r = reps[0]; // latest
    const reasons = [...new Set(reps.map(x => x.reason))];
    return `
    <div class="rep-card" id="rcard_${cardId}">
      <div class="rep-card-top">
        <div class="rep-avatar">${r.cardEmoji||'👷'}</div>
        <div class="rep-info">
          <div class="rep-name">${esc(r.cardName)}</div>
          <div class="rep-city">📍 ${esc(r.cardCity)} • ${reps.length} بلاغ</div>
        </div>
      </div>
      <div class="rep-desc">${esc(r.cardDesc)}</div>
      <div class="rep-reasons">
        ${reasons.map(rs => `<span class="reason-tag">⚠️ ${esc(rs)}</span>`).join('')}
      </div>
      <div class="rep-phone">📞 ${esc(r.cardPhone)}</div>
      <div class="rep-meta">🕐 ${esc(r.time)}</div>
      <div class="rep-actions">
        <button class="btn-delete" onclick="deleteCard(${cardId})">🗑️ حذف المنشور</button>
        <button class="btn-ignore" onclick="ignoreReports(${cardId})">✅ تجاهل البلاغ</button>
        <a class="btn-wa" href="${waLink(r.cardPhone)}" target="_blank" style="flex:0;padding:10px 14px;font-size:13px">
          <svg width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M16 0C7.163 0 0 7.163 0 16c0 2.822.736 5.476 2.023 7.787L0 32l8.385-2.2A15.94 15.94 0 0016 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm8.07 22.286c-.334.94-1.96 1.794-2.705 1.91-.744.116-1.667.164-2.69-.168-1.023-.332-2.33-.776-4.002-1.52-3.525-1.564-5.83-5.13-6.006-5.37-.176-.24-1.437-1.91-1.437-3.642s.91-2.58 1.233-2.932c.323-.352.703-.44.937-.44l.673.013c.216.009.504-.082.789.603.285.684 1.97 4.82 2.14 5.17.17.35.284.76.056 1.21-.228.45-.342.73-.67 1.12-.33.39-.694.87-.99 1.17-.297.3-.606.624-.261 1.224.346.6 1.538 2.537 3.304 4.11 2.27 2.027 4.187 2.655 4.786 2.96.6.305.95.256 1.3-.154.35-.41 1.492-1.74 1.89-2.337.397-.598.794-.498 1.34-.298.548.2 3.473 1.638 4.07 1.936.597.298.994.447 1.14.695.146.248.146 1.437-.188 2.376z"/></svg>
          تواصل
        </a>
      </div>
    </div>`;
  }).join('');
}

function deleteCard(cardId) {
  const id = Number(cardId);
  cards = cards.filter(c => c.id !== id);
  reports = reports.filter(r => r.cardId !== id);
  save(); renderAdmin(); renderCards();
  toast('🗑️ تم حذف المنشور', '#ef4444');
}

function ignoreReports(cardId) {
  const id = Number(cardId);
  reports = reports.filter(r => r.cardId !== id);
  save(); renderAdmin(); renderCards();
  toast('✅ تم تجاهل البلاغ');
}

// ─── Toast ────────────────────────────────────────────────────────────────────
function toast(msg, bg='#22c55e') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.background = bg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 3000);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
renderCards();
</script>
</body>
</html>
